name: Build, test & deploy (Cloudflare)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_test_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}

      - name: Dependency Audit (production only)
        run: npm audit --audit-level=high --omit=dev

      # Needs repo secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"
      # + D1 Edit). Skipped until it is added.
      - name: Apply D1 migrations & deploy Worker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
